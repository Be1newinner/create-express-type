# Run the API + PostgreSQL:  cp .env.example .env && docker compose up --build
# Or just the database for local dev:  docker compose up -d postgres
services:
  app:
    build: .
    ports:
      - "${PORT:-8005}:8005"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8005
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
