# Run the API + MongoDB:  cp .env.example .env && docker compose up --build
# Or just the database for local dev:  docker compose up -d mongo
services:
  app:
    build: .
    ports:
      - "${PORT:-8005}:8005"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8005
      MONGODB_URI: mongodb://mongo:27017/mydb
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
